<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Login Callback</title>
</head>
<body>
    <p>Logging in, please wait...</p>
    <script>
        // URL-il varunna code-ai eduthu backend-kku ayakkunno allathu handle seyyunnoulla logic ivide ezhuthanam
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            // Success aayathum dashboard-ilekku redirect seyyunnu
            window.location.href = 'https://adaudit.xyz/?google_connected=true';
        } else {
            document.body.innerHTML = '<p>Login failed. Please try again.</p>';
        }
    </script>
</body>
</html>
